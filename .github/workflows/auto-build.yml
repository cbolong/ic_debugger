# push 到 main 就自動打包 Windows 單一 exe 並發佈 Release（不需手動觸發）。
# 流程參考 ic-monitor 的 auto-build，兩個刻意的不同：
#   1. 產物是單一 IC_Debugger.exe 直接上 Release，不打 zip。
#   2. paths-ignore 只忽略「根目錄」的 *.md 說明文件 —— specs/**/*.md 是產品
#      內容（打包進 exe），改 spec 必須觸發 build。GitHub 的 '*.md' 不跨斜線，
#      正好符合；不要改成 '**.md'。
name: Auto Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/test_ui.py 用 node --check 驗「Python 實際輸出的內嵌 JS」語法，
      # 明確裝 Node 讓這個測試在 runner 上絕不靜默跳過。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller 鎖主版本：bootloader/打包行為隨主版本大改，
          # 不鎖的話「同一份 code 兩次 build 行為不同」（ic-monitor 事故）。
          pip install "pyinstaller>=6,<7" pytest
          # bridge 競態測試（tests/test_bridge_init.py，重演 2026-08-24 現場
          # 事故）需要真瀏覽器：不裝 playwright 時這 3 條在 CI 會靜默 skip
          # （R4 審查抓到 CI 與本機 passed 數不一致）——裝上讓 CI 跑滿全部測試。
          pip install playwright
          python -m playwright install chromium

      - name: Syntax check（先擋 Python 層錯誤，別浪費打包時間）
        run: python -m compileall -q main.py app_state.py app_config.py core ui tools tests

      - name: Unit tests
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: .
          # 測試訊息多為中文；runner console 預設 cp1252 會印成亂碼，
          # 失敗時 log 不可讀（ic-monitor §109）。
          PYTHONIOENCODING: utf-8

      - name: Build EXE
        run: pyinstaller ic_debugger_win.spec --clean --noconfirm

      # 打包後的自我驗證：單元測試讀的是 repo 目錄，看不見 exe 內部。
      # 這一關直接執行剛做好的 exe，確認它真的載得到內建 spec
      # （2026-08-23 現場回報「找不到任何 spec」後補上的守門員）。
      - name: Self-test the packaged EXE
        run: |
          Write-Host "執行 dist/IC_Debugger.exe --selftest ..."
          $p = Start-Process -FilePath "dist/IC_Debugger.exe" -ArgumentList "--selftest" `
               -Wait -PassThru -NoNewWindow
          if (Test-Path "selftest_report.json") {
            Get-Content "selftest_report.json" | Write-Host
          } else {
            Write-Host "::error::exe 沒有產生 selftest_report.json"
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::打包後的 exe 自我驗證失敗（見上方報告）"
            exit 1
          }
          Write-Host "自我驗證通過：打包後的 exe 載得到內建 spec"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $short = "${{ github.sha }}".Substring(0,7)
          $date = Get-Date -Format "yyyy-MM-dd"
          $tag = "build-${date}-${short}"
          gh release create $tag "dist/IC_Debugger.exe" --title "IC Debugger ${date} (${short})" --notes "Auto-build from commit ${{ github.sha }}" --latest

      - name: Cleanup old releases (keep latest 2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh release list --json tagName --jq '.[].tagName' | Where-Object { $_ -match '^build-' }
          if ($releases.Count -gt 2) {
            $toDelete = $releases | Select-Object -Skip 2
            foreach ($tag in $toDelete) {
              Write-Host "Deleting old release: $tag"
              gh release delete $tag --yes --cleanup-tag
            }
          }
